# Restore test for the staging/pilot backups (T5.7, docs/13 §5).
# Takes the newest artifact of "Backup staging database", decrypts it and
# restores it into a throwaway PostgreSQL. Prints only counts and timing.
name: Backup restore test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 1 * *' # 1st of every month, 02:30 IST

permissions:
  contents: read
  actions: read # to find and download the backup artifact

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore-test-only
          POSTGRES_DB: restore_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GH_TOKEN: ${{ github.token }}
      PASSPHRASE: ${{ secrets.STAGING_BACKUP_PASSPHRASE }}
      TARGET: postgresql://restore:restore-test-only@localhost:5432/restore_test
    steps:
      - name: Download the newest backup
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow backup-staging.yml \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then echo "::error::No successful backup run found."; exit 1; fi
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -D in
          ls -lR in
      - name: Decrypt
        run: |
          f=$(find in -name '*.dump.gpg' | head -1)
          echo "Backup file: $(basename "$f")"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --decrypt --output db.dump "$f"
      - name: Restore (app schema only)
        run: |
          start=$(date +%s)
          docker run --rm --network host -v "$PWD:/w" postgres:17-alpine \
            pg_restore --dbname="$TARGET" --schema=public --no-owner --no-privileges \
            --exit-on-error /w/db.dump
          echo "Restore took $(( $(date +%s) - start )) s"
      - name: Check the restored data
        run: |
          q() { docker run --rm --network host postgres:17-alpine psql "$TARGET" -At -c "$1"; }
          migrations=$(q 'select count(*) from public."_prisma_migrations" where finished_at is not null')
          echo "Applied migrations: $migrations"
          for t in Organization User OrganizationMember MemberInvite; do
            echo "$t rows: $(q "select count(*) from public.\"$t\"")"
          done
          if [ "$migrations" -lt 1 ] || [ "$(q 'select count(*) from public."Organization"')" -lt 1 ]; then
            echo "::error::Restored database is missing migrations or businesses."
            exit 1
          fi
          echo "Restore test passed."
