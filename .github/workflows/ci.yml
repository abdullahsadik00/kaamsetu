# CI for KaamSetu (docs/13 §3). Runs on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway database that exists only inside this CI job.
          POSTGRES_USER: kaamsetu
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kaamsetu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaamsetu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kaamsetu:ci-only-password@localhost:5432/kaamsetu_test?schema=public
      # Test-only secrets, valid only inside this CI job.
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000
      OTP_HASH_SECRET: ci-only-otp-secret-not-used-anywhere-else-000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (also generates the Prisma client)
        run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Build (type-checks the code)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e

  mobile:
    name: Mobile (lint, type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # The Expo demo template still has a few lint/type errors in files the
      # mobile shell (task T3.6) replaces. Reported, not blocking, until then.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true
